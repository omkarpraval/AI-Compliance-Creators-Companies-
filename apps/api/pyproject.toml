[project]
name = "verifyd-api"
version = "1.0.0"
description = "Verifyd AI Influencer Compliance Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "cryptography>=43.0.0",
    "python-ulid>=3.0.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.17",
    "pdfplumber>=0.11.4",
    "pypdf>=5.1.0",
    "rapidfuzz>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-env>=1.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
